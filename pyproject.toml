[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-poe"
version = "0.1.0"
description = "Hash a directory of files and anchor the hashes on Solana as proof-of-existence via the Memo program."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "solana>=0.34,<1.0",
    "click>=8.1",
]

[project.scripts]
solana-poe = "solana_poe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
